name: Resumen semanal a profesionales

# Los lunes, a cada profesional que recibió contactos la semana anterior:
# «Esta semana te escribieron N personas por ContrataCR. ¿Con cuántas cerraste
# trabajo?». Una vez por semana por profesional. Ver resumen-semanal.ts.

on:
  schedule:
    # Lunes 8:00 a.m. en Costa Rica: empieza la semana con el resumen de la anterior.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente donde enviar."
        required: true
        type: choice
        options:
          - production
          - test
      modo:
        description: "Qué hacer."
        required: true
        default: simular
        type: choice
        options:
          # Cuenta a cuántos enviaría, sin escribir nada.
          - simular
          # Envía de verdad.
          - enviar

concurrency:
  group: resumen-semanal-${{ github.event_name == 'schedule' && 'production' || inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enviar:
    name: Resumen semanal en ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    env:
      TARGET: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
      # La tarea de los lunes SÍ envía; a mano se simula salvo que se pida lo contrario.
      SIMULAR: ${{ github.event_name == 'schedule' && '' || (inputs.modo == 'simular' && '?simular=1' || '') }}
      APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate target and secrets
        id: revisar
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::$TARGET todavía no tiene CRON_SECRET; el resumen semanal no está configurado."
            echo "configurado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$APP_URL" ]; then
            echo "::warning::$TARGET todavía no tiene NEXT_PUBLIC_APP_URL."
            echo "configurado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configurado=si" >> "$GITHUB_OUTPUT"
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::NEXT_PUBLIC_APP_URL must be an https URL."; exit 1 ;;
          esac

      - name: Enviar el resumen a quien recibió contactos
        if: ${{ steps.revisar.outputs.configurado == 'si' }}
        run: |
          set -euo pipefail
          base="${APP_URL%/}"
          body="$(mktemp)"
          # El secreto solo viaja en una cabecera escrita desde el entorno: no
          # puede llegar a la línea de comandos ni al registro.
          status="$(curl -sS -o "$body" -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
            -X POST "$base/api/internal/resumen-semanal$SIMULAR" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")"

          echo "HTTP $status"
          # La respuesta solo trae contadores, nunca quiénes.
          cat "$body"; echo

          if [ "$status" = "503" ] && grep -q "cron_not_configured" "$body"; then
            echo "::warning::$TARGET todavía no tiene configurado el resumen semanal."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::El resumen semanal respondió HTTP $status."
            exit 1
          fi
          if ! grep -q '"ok":true' "$body"; then
            echo "::error::El resumen semanal reportó una falla."
            exit 1
          fi
