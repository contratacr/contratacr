name: Apply direct chat archive migration to test once

on:
  push:
    branches: [test]
    paths:
      - "supabase/migrations/126_participant_direct_chat_archives.sql"
      - ".github/workflows/apply-direct-chat-archive-test-once.yml"

jobs:
  migrate:
    environment: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply pending test migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all
