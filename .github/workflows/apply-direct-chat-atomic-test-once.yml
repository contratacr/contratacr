name: Apply atomic direct chat migration to test once

on:
  push:
    branches: [test]
    paths:
      - "supabase/migrations/127_atomic_direct_chat_delivery.sql"
      - ".github/workflows/apply-direct-chat-atomic-test-once.yml"

jobs:
  migrate:
    environment: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0
      - name: Apply pending test migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
