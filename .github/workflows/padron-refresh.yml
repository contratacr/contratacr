name: Padron refresh

on:
  schedule:
    - cron: "0 6 1 * *" # Monthly production refresh.
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to refresh."
        required: true
        type: choice
        options:
          - test
          - production

concurrency:
  group: padron-refresh-${{ github.event_name == 'schedule' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh padron in ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    permissions:
      contents: read
    env:
      TARGET: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PADRON_SAMPLE_CEDULA: "101053316"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate target and secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_DB_URL, SUPABASE_URL, or SUPABASE_SERVICE_ROLE_KEY in the $TARGET GitHub Environment."
            exit 1
          fi
          if [ "$TARGET" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production padron refresh must run from main."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Download and unzip padron
        run: |
          curl -L --retry 3 --retry-delay 5 -o padron.zip "https://www.tse.go.cr/zip/padron/padron_completo.zip"
          unzip -o padron.zip -d padron
          PADRON_FILE="$(find padron -maxdepth 2 -iname 'padron_completo.txt' -print -quit)"
          if [ -z "$PADRON_FILE" ]; then
            echo "Could not find padron_completo.txt inside the downloaded zip."
            find padron -maxdepth 2 -type f -print
            exit 1
          fi
          echo "PADRON_FILE=$PADRON_FILE" >> "$GITHUB_ENV"

      - name: Prepare padron COPY file
        run: |
          node scripts/prepare-padron-copy.mjs "$PADRON_FILE" padron-copy.tsv
          echo "PADRON_COPY_FILE=$PWD/padron-copy.tsv" >> "$GITHUB_ENV"

      - name: Load into Supabase with COPY
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "truncate table public.padron_staging;"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "\\copy public.padron_staging (cedula, nombre, papellido, sapellido) from '$PADRON_COPY_FILE' with (format text, delimiter E'\\t')"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            staging_count bigint;
          BEGIN
            SELECT count(*) INTO staging_count FROM public.padron_staging;
            IF staging_count < 3000000 THEN
              RAISE EXCEPTION 'padron_staging has only % rows; refusing to swap', staging_count;
            END IF;
          END;
          $$;
          SQL
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select public.finalize_padron_swap();"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select * from public.padron_lookup('$PADRON_SAMPLE_CEDULA');"

      - name: Verify SQL padron lookup
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select * from public.padron_lookup('$PADRON_SAMPLE_CEDULA');"

      - name: Verify REST padron lookup
        run: |
          set -euo pipefail
          response="$(curl -fsS "$SUPABASE_URL/rest/v1/rpc/padron_lookup" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_cedula\":\"$PADRON_SAMPLE_CEDULA\"}")"
          printf '%s' "$response" | node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); const row = Array.isArray(data) ? data[0] : data; if (!row || !row.nombre) { console.error('padron_lookup REST returned no row.'); process.exit(1); } console.log('REST padron lookup ok.');"
