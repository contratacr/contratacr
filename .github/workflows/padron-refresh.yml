name: Padron refresh

on:
  schedule:
    - cron: "0 6 1 * *" # Monthly production refresh.
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to refresh."
        required: true
        type: choice
        options:
          - test
          - production

concurrency:
  group: padron-refresh-${{ github.event_name == 'schedule' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh padron in ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    permissions:
      contents: read
    env:
      TARGET: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PADRON_SAMPLE_CEDULA: "101053316"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target and secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY in the $TARGET GitHub Environment."
            exit 1
          fi
          if [ "$TARGET" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production padron refresh must run from main."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and unzip padron
        run: |
          curl -L --retry 3 --retry-delay 5 -o padron.zip "https://www.tse.go.cr/zip/padron/padron_completo.zip"
          unzip -o padron.zip -d padron
          PADRON_FILE="$(find padron -maxdepth 2 -iname 'padron_completo.txt' -print -quit)"
          if [ -z "$PADRON_FILE" ]; then
            echo "Could not find padron_completo.txt inside the downloaded zip."
            find padron -maxdepth 2 -type f -print
            exit 1
          fi
          echo "PADRON_FILE=$PADRON_FILE" >> "$GITHUB_ENV"

      - name: Load into Supabase
        run: node scripts/load-padron.mjs "$PADRON_FILE"

      - name: Verify padron lookup
        run: node scripts/check-padron.mjs --sample="$PADRON_SAMPLE_CEDULA"
