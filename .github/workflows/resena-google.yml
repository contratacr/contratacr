name: Invitación a reseñar en Google

# La invitación «¿Nos dejas una reseña?» ya no sale al registrarse: una vez al
# día se invita a quien lleva al menos 3 días y ya tuvo una experiencia real
# (publicó un proyecto, escribió por el chat, dejó o recibió una reseña). Cada
# cuenta recibe la invitación una sola vez. Ver invitar-tras-experiencia.ts.

on:
  schedule:
    # 10:00 a.m. en Costa Rica: a esa hora la invitación llega con la gente despierta.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente donde invitar."
        required: true
        type: choice
        options:
          - production
          - test
      modo:
        description: "Qué hacer."
        required: true
        default: simular
        type: choice
        options:
          # Cuenta a cuántas invitaría, sin escribir nada.
          - simular
          # Invita de verdad.
          - invitar

concurrency:
  group: resena-google-${{ github.event_name == 'schedule' && 'production' || inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  invitar:
    name: Invitar a reseñar en ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    env:
      TARGET: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
      # La tarea diaria SÍ invita; a mano se simula salvo que se pida lo contrario.
      SIMULAR: ${{ github.event_name == 'schedule' && '' || (inputs.modo == 'simular' && '?simular=1' || '') }}
      APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate target and secrets
        id: revisar
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::$TARGET todavía no tiene CRON_SECRET; la invitación no está configurada."
            echo "configurado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$APP_URL" ]; then
            echo "::warning::$TARGET todavía no tiene NEXT_PUBLIC_APP_URL."
            echo "configurado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configurado=si" >> "$GITHUB_OUTPUT"
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::NEXT_PUBLIC_APP_URL must be an https URL."; exit 1 ;;
          esac

      - name: Invitar a quien ya usó la app
        if: ${{ steps.revisar.outputs.configurado == 'si' }}
        run: |
          set -euo pipefail
          base="${APP_URL%/}"
          body="$(mktemp)"
          # El secreto solo viaja en una cabecera escrita desde el entorno: no
          # puede llegar a la línea de comandos ni al registro.
          status="$(curl -sS -o "$body" -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
            -X POST "$base/api/internal/resena-google$SIMULAR" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")"

          echo "HTTP $status"
          # La respuesta solo trae contadores, nunca quiénes.
          cat "$body"; echo

          if [ "$status" = "503" ] && grep -q "cron_not_configured" "$body"; then
            echo "::warning::$TARGET todavía no tiene configurada la invitación."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::La invitación respondió HTTP $status."
            exit 1
          fi
          if ! grep -q '"ok":true' "$body"; then
            echo "::error::La invitación reportó una falla."
            exit 1
          fi
