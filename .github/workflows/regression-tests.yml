name: Regression Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright regression (test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    env:
      PLAYWRIGHT_BASE_URL: https://contratacr-git-test-isanchezm421-6251s-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: test

      - name: Validate test target
        run: |
          set -euo pipefail
          echo "Checked out test branch for regression."
          echo "Running regression against $PLAYWRIGHT_BASE_URL"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
