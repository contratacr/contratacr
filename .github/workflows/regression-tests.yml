name: Regression Tests

on:
  workflow_dispatch:
  push:
    branches:
      - test
  schedule:
    # Cada madrugada (3:00 a.m. de Costa Rica) corre la regresión EXHAUSTIVA
    # completa, la misma que antes solo salía a mano: así un fallo aparece al
    # día siguiente y no cuando alguien se acuerda de despacharla. Los lunes
    # además pasa Safari (WebKit), el motor del iPhone y de la app.
    - cron: "0 9 * * *"

concurrency:
  # This workflow only touches the local Supabase stack it starts itself, so it
  # keeps its own group: sharing one with the deploy and mobile workflows let
  # any of their queued runs cancel a pending manual release regression.
  group: contratacr-local-regression
  cancel-in-progress: false

permissions:
  contents: read

# Official Supabase mirror; shared ECR runner IPs exceeded the anonymous pull limit.
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  local-database-contract:
    name: Local schema and fast contracts
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Each exhaustive shard gets its own database and server. Push smoke
        # remains a single job; no shared fixtures are mutated concurrently.
        # Six smaller groups limit lost work if a hosted runner is reclaimed.
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1,2,3,4,5,6]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start the minimal local Supabase stack
        run: >-
          supabase start
          --exclude imgproxy,postgres-meta,studio,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild every migration from an empty database
        run: supabase db reset --local --no-seed

      - name: Seed and verify the synthetic local regression foundation
        env:
          LOCAL_REGRESSION_PASSWORD: LocalRegression!2026
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/contratacr-local-supabase.env
          set -a
          source /tmp/contratacr-local-supabase.env
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export LOCAL_REGRESSION_SEED=1
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            printf '%s=%s\n' "SUPABASE_SERVICE_ROLE_KEY" "$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "LOCAL_REGRESSION_SEED=1"
            echo "E2E_FIXTURES_READY=1"
            echo "E2E_LEGACY_SEED=0"
            echo "E2E_ALLOW_NON_TEST_SUPABASE=1"
            echo "E2E_TEST_PASSWORD=$LOCAL_REGRESSION_PASSWORD"
            echo "REGRESSION_TEST_PASSWORD=$LOCAL_REGRESSION_PASSWORD"
            # La cuenta de solo cliente (seed-cuenta-cliente.js); la contraseña
            # es la misma que ya usan las pruebas que entran con ella.
            echo "CLIENTE_TEST_PASSWORD=ClientePruebas2026!"
            echo "PLAYWRIGHT_LOCAL_PRODUCTION=1"
            echo "PLAYWRIGHT_PORT=3000"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "CI_REQUEST_LOG=1"
          } >> "$GITHUB_ENV"
          psql "$DB_URL" \
            --set=local_seed_guard=contratacr-local-only \
            --file=scripts/ci/grant-local-regression-service-role.sql
          psql "$DB_URL" \
            --set=local_seed_guard=contratacr-local-only \
            --set=regression_password="$LOCAL_REGRESSION_PASSWORD" \
            --file=scripts/ci/seed-local-regression-auth.sql
          npm run seed:local:regression
          npm run verify:local:regression
          npm run seed:local:relations
          npm run verify:local:relations
          # En este mismo paso GITHUB_ENV todavía no rige: la contraseña va directa.
          CLIENTE_TEST_PASSWORD='ClientePruebas2026!' node scripts/seed-cuenta-cliente.js

      - name: Verify local Realtime before browser regression
        run: node scripts/ci/verify-local-realtime.mjs

      - name: Verify catalogue cache races and profile query budgets
        run: |
          node scripts/verify-approved-catalog-cache.mjs
          node scripts/verify-catalog-r2-runtime.mjs
          node scripts/verify-professional-profile-queries.mjs

      - name: Verify native Google and Apple session isolation
        run: |
          npm run test:native-social-linking
          node scripts/verify-public-display-names.mjs

      - name: Verify account deletion isolation locally
        run: npm run test:account-deletion

      - name: Verify lifecycle email coordination without sending mail
        run: node scripts/verify-lifecycle-coordination.mjs

      - name: Verify durable email and verification history in isolated Postgres
        run: |
          npm install --prefix "$RUNNER_TEMP/ccr-email-contract" --no-save --ignore-scripts @electric-sql/pglite@0.5.9
          PGLITE_MODULE_PATH="$RUNNER_TEMP/ccr-email-contract/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-email-delivery.mjs

      - name: Verify own views and contacts never inflate marketplace statistics
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/ccr-email-contract/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-self-interaction-exclusion.mjs

      - name: Verify durable push isolation locally
        run: npm run test:push-isolation

      - name: Reverify canonical fixtures after isolation contracts
        run: npm run verify:local:relations

      - name: Ensure private env files are not tracked
        run: npm run security:env

      - name: Verify every application surface has a regression owner
        run: npm run test:surface-ownership
      - name: Verify complete source testing inventory
        run: node scripts/testing-inventory.mjs --check

      - name: Typecheck application and regression contracts
        run: npx tsc --noEmit

      - name: Lint regression contracts
        run: npx eslint tests/e2e playwright.config.ts scripts/ci/verify-app-surface-ownership.mjs scripts/seed-local-regression-foundation.js scripts/verify-local-regression-foundation.js

      - name: Reject new hard-coded bilingual strings
        run: npm run lint:i18n

      - name: Reject old section names (one name per section)
        run: npm run lint:vocabulario

      - name: Build the production application locally
        run: npm run build

      - name: Install browser engines for registration and push smoke
        if: github.event_name == 'push'
        run: npx playwright install --with-deps chromium webkit

      - name: Verify Safari registration before broader browser checks
        if: github.event_name == 'push'
        env:
          PLAYWRIGHT_WEBKIT: "1"
          PLAYWRIGHT_OUTPUT_DIR: test-results-registration-safari-first
          PLAYWRIGHT_JSON_REPORT: test-results-registration-safari-first/results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-registration-safari-first
        run: |
          npx playwright test --project=webkit-mobile registration-navigation verification-documents --max-failures=1
          npm run test:e2e:verify-results

      - name: Verify registration and assistant navigation before broader smoke
        if: github.event_name == 'push'
        env:
          PLAYWRIGHT_OUTPUT_DIR: test-results-assistant-first
          PLAYWRIGHT_JSON_REPORT: test-results-assistant-first/results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-assistant-first
        run: |
          npx playwright test registration-navigation verification-documents hacienda-verification-runtime
          npm run test:e2e:verify-results
          npx playwright test native-social-access auth-screens despues-del-registro assistant-navigation admin-identifications
          npm run test:e2e:verify-results

      - name: Verify assistant navigation and badges in Safari
        if: github.event_name == 'push'
        env:
          PLAYWRIGHT_WEBKIT: "1"
          PLAYWRIGHT_OUTPUT_DIR: test-results-safari-first
          PLAYWRIGHT_JSON_REPORT: test-results-safari-first/results.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-safari-first
        run: npx playwright test --project=webkit-mobile native-social-access auth-screens despues-del-registro assistant-navigation verification-badges navbar-brand-consistency admin-mfa account-mfa web-chat-parity contact-channel-stability last-used-sign-in search-suggestion-confirmation buscar-servicio-y-lugar

      - name: Require clean Safari assistant results
        if: github.event_name == 'push'
        env:
          PLAYWRIGHT_JSON_REPORT: test-results-safari-first/results.json
        run: npm run test:e2e:verify-results

      - name: Run public routes and recent UI smoke on every push
        if: github.event_name == 'push'
        run: >-
          npx playwright test
          auth-support borrador-sin-sesion ai-assistant admin-identifications hacienda-verification-runtime verification-documents current-profile-names-runtime admin-mfa account-mfa web-chat-parity contact-channel-stability last-used-sign-in search-suggestion-confirmation buscar-servicio-y-lugar admin-profile-edit-runtime admin-padron-runtime public-smoke app-download mobile-menu-surface verification-badges navbar-brand-consistency mensajes-sin-parpadeo landing-media-budget android-auth-return-presentation avatar-framing shared-link-language admin-contact-segments admin-list-limits-runtime contact-context-measurement marketplace-paging-server marketplace-progressive-loading lifecycle-email-policy campaign-delivery-contract profile-reminder mobile-app-campaign

      - name: Require clean push smoke results
        if: github.event_name == 'push'
        run: npm run test:e2e:verify-results

      - name: Verify fixtures after public push smoke
        if: github.event_name == 'push' && always()
        run: npm run verify:local:relations

      - name: Si el código no cambió desde la última certificación, no se repite
        if: github.event_name == 'schedule'
        id: novedad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una regresión de 20 minutos sobre el mismo commit que ya pasó anoche
          # no dice nada nuevo. Se busca la última corrida exhaustiva en verde:
          # si fue sobre este mismo commit, la de hoy se salta.
          ultimo=$(gh run list --workflow=regression-tests.yml --branch test --status success --limit 20 --json headSha,event -q '[.[] | select(.event != "push")] | .[0].headSha // ""')
          if [ "$ultimo" = "${{ github.sha }}" ]; then
            echo "Sin cambios desde la última certificación ($ultimo): no se repite."
            echo "repetir=false" >> "$GITHUB_OUTPUT"
          else
            echo "repetir=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ¿Es lunes? (Safari pasa una vez por semana)
        id: dia
        if: github.event_name == 'schedule'
        run: echo "lunes=$([ "$(date -u +%u)" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install Safari for the weekly WebKit pass
        if: github.event_name == 'workflow_dispatch' || steps.dia.outputs.lunes == 'true'
        run: npx playwright install --with-deps webkit

      - name: Run the public surfaces in Safari
        if: steps.dia.outputs.lunes == 'true' && matrix.shard == 1
        env:
          PLAYWRIGHT_WEBKIT: "1"
        run: >-
          npx playwright test --project=webkit-mobile
          public-smoke search-results professional-profile services recent-visual-regression navbar-brand-consistency mensajes-sin-parpadeo

      - name: Install Playwright browser for a manual release regression
        if: github.event_name != 'push' && steps.novedad.outputs.repetir != 'false'
        run: npx playwright install --with-deps chromium

      - name: Run the exhaustive local release regression once
        env:
          PLAYWRIGHT_WEBKIT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        if: github.event_name != 'push' && steps.novedad.outputs.repetir != 'false'
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_JSON_REPORT="test-results/results-${{ matrix.shard }}.json"
          export PLAYWRIGHT_OUTPUT_DIR="test-results/shard-${{ matrix.shard }}"
          export PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/shard-${{ matrix.shard }}"
          npx playwright test --shard="${{ matrix.shard }}/6"

      - name: Dump the local Supabase container logs after a failed regression
        if: github.event_name != 'push' && steps.novedad.outputs.repetir != 'false' && failure()
        shell: bash
        run: |
          for name in $(docker ps --format '{{.Names}}' | grep -E 'supabase_(auth|rest|kong)_' || true); do
            echo "::group::$name"
            # Kong is the request journal of the stack; the browser's realtime
            # reconnect attempts (the service is not started here) are noise.
            docker logs --tail 30000 "$name" 2>&1 | grep -v '/realtime/v1/websocket' | tail -8000 || true
            echo "::endgroup::"
          done

      - name: Require zero failures, flakies and unexpected skips
        if: github.event_name != 'push' && steps.novedad.outputs.repetir != 'false'
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_JSON_REPORT="test-results/results-${{ matrix.shard }}.json" npm run test:e2e:verify-results

      - name: Verify synthetic fixtures after the release regression
        if: github.event_name != 'push' && steps.novedad.outputs.repetir != 'false' && always()
        run: npm run verify:local:relations

      - name: Upload Playwright report
        if: always() && (github.event_name == 'push' || steps.novedad.outputs.repetir != 'false')
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            playwright-report-assistant-first/
            test-results-assistant-first/
            playwright-report-safari-first/
            test-results-safari-first/
            playwright-report-registration-safari-first/
            test-results-registration-safari-first/
            test-results/results*.json
            test-results/**/assistant-*-verified-name.png
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
