name: Regression Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Test environment URL. Leave empty to use the PLAYWRIGHT_BASE_URL repository variable."
        required: false
        type: string

jobs:
  e2e:
    name: Playwright regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || vars.PLAYWRIGHT_BASE_URL }}
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target URL
        run: |
          if [ -z "$PLAYWRIGHT_BASE_URL" ]; then
            echo "Set a base_url input or a repository variable named PLAYWRIGHT_BASE_URL."
            exit 1
          fi
          echo "Running regression against $PLAYWRIGHT_BASE_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
