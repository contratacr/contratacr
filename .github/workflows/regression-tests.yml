name: Regression Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright regression (test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    env:
      PLAYWRIGHT_BASE_URL: https://contratacr-git-test-isanchezm421-6251s-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_SEED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: test

      - name: Validate test target
        run: |
          set -euo pipefail
          echo "Checked out test branch for regression."
          echo "Running regression against $PLAYWRIGHT_BASE_URL"
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Missing VERCEL_AUTOMATION_BYPASS_SECRET in the test GitHub Environment. Vercel preview deployments are protected, so Playwright will see the Vercel login page instead of ContrataCR."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing NEXT_PUBLIC_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY in the test GitHub Environment. These are required to seed regression accounts in the test Supabase project."
            exit 1
          fi
          if echo "$NEXT_PUBLIC_SUPABASE_URL" | grep -q "kskueodxaksxvjrysouw"; then
            echo "::error::Refusing to run seeded regression against production Supabase."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
