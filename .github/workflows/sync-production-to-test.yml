name: Sync production data to test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type SYNC_PRODUCTION_TO_TEST"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-production-to-test.yml

concurrency:
  group: production-to-test-data-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  PG_BIN: /usr/lib/postgresql/17/bin
  PGSSLMODE: require

jobs:
  export-production:
    name: Export production mirror
    if: github.event_name == 'push' || inputs.confirmation == 'SYNC_PRODUCTION_TO_TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      SOURCE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TRANSFER_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_DB_URL" || { echo "::error::Missing production SUPABASE_DB_URL."; exit 1; }
          test -n "$TRANSFER_PASSPHRASE" || { echo "::error::Missing production BACKUP_ENCRYPTION_PASSPHRASE."; exit 1; }
          if echo "$SOURCE_DB_URL" | grep -q ':6543/'; then
            echo "::error::Use a direct/session-mode production URL on port 5432."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: bash scripts/ci/install-postgres-client.sh

      - name: Export and encrypt production data
        shell: bash
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/contratacr-mirror"
          mkdir -p "$mirror"

          # Public application data is mirrored. Private histories are rebuilt
          # only between the two authorized regression actors in test.
          PRIVATE_TABLES=(
            ai_chat_sessions beneficiary_dob bookings category_suggestions
            direct_conversations direct_messages interaction_events job_applications
            notification_deliveries notifications professional_follows projects proposals
            provider_appeals provider_verification_log reports reviews saved_items
            saved_professionals subscription_payments subscriptions support_messages
            support_ticket_messages support_tickets user_action_audit user_push_tokens
            whatsapp_contact_followups
          )
          EXCLUDES=(--exclude-table-data=public.padron --exclude-table-data=public.padron_staging)
          for table in "${PRIVATE_TABLES[@]}"; do
            EXCLUDES+=("--exclude-table-data=public.${table}")
          done

          "$PG_BIN/pg_dump" "$SOURCE_DB_URL" \
            --format=custom --compress=9 --data-only --schema=public \
            --no-owner --no-acl "${EXCLUDES[@]}" \
            --file="$mirror/production-public-data.dump"

          "$PG_BIN/psql" "$SOURCE_DB_URL" --no-psqlrc --csv -Atc \
            "select id from public.profiles order by id" > "$mirror/production-profile-ids.csv"
          "$PG_BIN/psql" "$SOURCE_DB_URL" --no-psqlrc --csv -Atc \
            "select lower(trim(p.business_name)), coalesce(pr.avatar_url, '') from public.professionals p join public.profiles pr on pr.id=p.profile_id where lower(trim(p.business_name)) in ('contratacr','sg solutions') order by 1" \
            > "$mirror/production-regression-photos.csv"

          test -s "$mirror/production-public-data.dump"
          test -s "$mirror/production-profile-ids.csv"
          test "$(wc -l < "$mirror/production-regression-photos.csv" | tr -d ' ')" -eq 2
          (cd "$mirror" && sha256sum production-public-data.dump production-profile-ids.csv production-regression-photos.csv > SHA256SUMS)
          tar -C "$mirror" -czf "$RUNNER_TEMP/production-test-mirror.tar.gz" \
            production-public-data.dump production-profile-ids.csv production-regression-photos.csv SHA256SUMS
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase "$TRANSFER_PASSPHRASE" \
            --output "$RUNNER_TEMP/production-test-mirror.tar.gz.gpg" \
            "$RUNNER_TEMP/production-test-mirror.tar.gz"
          rm -rf "$mirror" "$RUNNER_TEMP/production-test-mirror.tar.gz"

      - name: Upload short-lived encrypted mirror
        uses: actions/upload-artifact@v4
        with:
          name: production-test-mirror-${{ github.run_id }}
          path: ${{ runner.temp }}/production-test-mirror.tar.gz.gpg
          if-no-files-found: error
          retention-days: 1

  restore-test:
    name: Replace test and seed regression pair
    needs: export-production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: test
    env:
      TEST_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TRANSFER_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REGRESSION_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate isolated test target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_DB_URL" || { echo "::error::Missing test SUPABASE_DB_URL."; exit 1; }
          test -n "$TRANSFER_PASSPHRASE" || { echo "::error::Missing test BACKUP_ENCRYPTION_PASSPHRASE."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Missing test Supabase URL."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing test service-role key."; exit 1; }
          echo "$NEXT_PUBLIC_SUPABASE_URL" | grep -q 'sodegkfjjrdkbohycqyq' || {
            echo "::error::Refusing to replace a Supabase project other than test."
            exit 1
          }
          if echo "$TEST_DB_URL" | grep -q 'kskueodxaksxvjrysouw'; then
            echo "::error::Refusing to write to production Supabase."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: bash scripts/ci/install-postgres-client.sh

      - name: Download encrypted mirror
        uses: actions/download-artifact@v4
        with:
          name: production-test-mirror-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Decrypt and verify mirror
        shell: bash
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/contratacr-mirror"
          mkdir -p "$mirror"
          gpg --batch --yes --decrypt --pinentry-mode loopback \
            --passphrase "$TRANSFER_PASSPHRASE" \
            --output "$RUNNER_TEMP/production-test-mirror.tar.gz" \
            "$RUNNER_TEMP/production-test-mirror.tar.gz.gpg"
          tar -C "$mirror" -xzf "$RUNNER_TEMP/production-test-mirror.tar.gz"
          (cd "$mirror" && sha256sum --check SHA256SUMS)

      - name: Create ephemeral rollback backup
        shell: bash
        run: |
          set -euo pipefail
          "$PG_BIN/pg_dump" "$TEST_DB_URL" \
            --format=custom --compress=6 --data-only --schema=public --no-owner --no-acl \
            --exclude-table-data=public.padron \
            --exclude-table-data=public.padron_staging \
            --file="$RUNNER_TEMP/contratacr-mirror/test-rollback.dump"

      - name: Replace test data and seed regression actors
        shell: bash
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/contratacr-mirror"

          rollback() {
            echo "::warning::Sync failed; restoring test from the ephemeral rollback."
            "$PG_BIN/psql" "$TEST_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 \
              --file=scripts/sync/truncate-test-data.sql
            "$PG_BIN/pg_restore" --dbname="$TEST_DB_URL" --data-only \
              --no-owner --no-acl --exit-on-error \
              "$mirror/test-rollback.dump"
          }
          trap rollback ERR

          {
            printf '%s\n' 'create temporary table production_profile_ids (id uuid primary key);'
            printf '%s\n' 'copy production_profile_ids (id) from stdin with (format csv);'
            cat "$mirror/production-profile-ids.csv"
            printf '%s\n' '\.'
            cat scripts/sync/prepare-test-mirror.sql
          } > "$mirror/prepare-test-mirror.generated.sql"
          "$PG_BIN/psql" "$TEST_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file="$mirror/prepare-test-mirror.generated.sql"
          "$PG_BIN/pg_restore" --dbname="$TEST_DB_URL" --data-only \
            --no-owner --no-acl --exit-on-error \
            "$mirror/production-public-data.dump"

          regression_password="${REGRESSION_TEST_PASSWORD:-ContrataCR!2026}"
          "$PG_BIN/psql" "$TEST_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file=scripts/sync/enable-regression-logins.sql \
            --set=regression_password="$regression_password"

          npm ci
          npm run seed:test:full
          npm run seed:test:verify

          "$PG_BIN/psql" "$TEST_DB_URL" --no-psqlrc --csv -Atc \
            "select lower(trim(p.business_name)), coalesce(pr.avatar_url, '') from public.professionals p join public.profiles pr on pr.id=p.profile_id where lower(trim(p.business_name)) in ('contratacr','sg solutions') order by 1" \
            > "$mirror/test-regression-photos.csv"
          diff -u "$mirror/production-regression-photos.csv" "$mirror/test-regression-photos.csv"
          trap - ERR

      - name: Remove all mirror files from the runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/contratacr-mirror" "$RUNNER_TEMP/production-test-mirror.tar.gz" "$RUNNER_TEMP/production-test-mirror.tar.gz.gpg"
