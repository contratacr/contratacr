name: Cloudflare Compatibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate only or deploy an isolated preview Worker."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy-preview
      worker_name:
        description: "Cloudflare Worker name used only when mode=deploy-preview."
        required: true
        default: contratacr-preview
      target_environment:
        description: "GitHub environment whose secrets are used for the build."
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: OpenNext Linux build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify private env files are absent
        run: npm run security:env

      - name: Build Cloudflare bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_APP_ID }}
        run: npm run cloudflare:build

      - name: Validate Worker bundle and report size
        if: ${{ inputs.mode == 'dry-run' }}
        run: npx wrangler deploy --dry-run

      - name: Deploy isolated preview Worker
        if: ${{ inputs.mode == 'deploy-preview' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --name "${{ inputs.worker_name }}"

      - name: Sync production Worker runtime secrets
        if: ${{ inputs.mode == 'deploy-preview' && inputs.target_environment == 'production' && inputs.worker_name == 'contratacr' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.NEXT_PUBLIC_FACEBOOK_APP_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PADRON_DATABASE_URL: ${{ secrets.PADRON_DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");

          const names = [
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY",
            "NEXT_PUBLIC_APP_URL",
            "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY",
            "NEXT_PUBLIC_GOOGLE_CLIENT_ID",
            "NEXT_PUBLIC_FACEBOOK_APP_ID",
            "SUPABASE_URL",
            "SUPABASE_SERVICE_ROLE_KEY",
            "PADRON_DATABASE_URL",
            "R2_ENDPOINT",
            "R2_ACCESS_KEY_ID",
            "R2_SECRET_ACCESS_KEY",
            "R2_BUCKET",
            "R2_PUBLIC_BASE_URL",
            "CLOUDINARY_CLOUD_NAME",
            "CLOUDINARY_API_KEY",
            "CLOUDINARY_API_SECRET"
          ];
          const secrets = {};
          for (const name of names) {
            const value = process.env[name]?.trim();
            if (value) secrets[name] = value;
          }
          fs.writeFileSync("worker-secrets.json", JSON.stringify(secrets));
          console.log(`Prepared ${Object.keys(secrets).length} production Worker runtime secrets.`);
          NODE
          npx wrangler secret bulk worker-secrets.json --name contratacr
