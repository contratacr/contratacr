name: Cloudflare Compatibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate only or deploy an isolated preview Worker."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy-preview
      worker_name:
        description: "Cloudflare Worker name used only when mode=deploy-preview."
        required: true
        default: contratacr-preview

permissions:
  contents: read

concurrency:
  group: cloudflare-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: OpenNext Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify private env files are absent
        run: npm run security:env

      - name: Build Cloudflare bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: npm run cloudflare:build

      - name: Validate Worker bundle and report size
        if: ${{ inputs.mode == 'dry-run' }}
        run: npx wrangler deploy --dry-run

      - name: Deploy isolated preview Worker
        if: ${{ inputs.mode == 'deploy-preview' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --name "${{ inputs.worker_name }}"
