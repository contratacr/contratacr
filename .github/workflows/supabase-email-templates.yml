name: Supabase email templates

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to update."
        required: true
        type: choice
        options:
          - test
          - production
      dry_run:
        description: "Preview template changes without applying them."
        required: true
        type: boolean
        default: true

concurrency:
  group: supabase-email-templates-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  sync:
    name: ${{ inputs.dry_run && 'Dry run' || 'Apply' }} email templates to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      TARGET_ENV: ${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate target
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN in the $TARGET_ENV GitHub Environment. Create it in Supabase Account Settings -> Access Tokens, then add it as a GitHub Environment secret."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            if [ -z "$SUPABASE_URL" ]; then
              echo "Missing SUPABASE_PROJECT_REF or SUPABASE_URL/NEXT_PUBLIC_SUPABASE_URL in the $TARGET_ENV GitHub Environment."
              exit 1
            fi
            SUPABASE_PROJECT_REF="$(node -e "const url = process.env.SUPABASE_URL; const host = new URL(url).host; console.log(host.split('.')[0])")"
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF" >> "$GITHUB_ENV"
          fi
          if [ "$TARGET_ENV" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production email templates must run from main."
            exit 1
          fi

      - name: Validate templates
        run: npm run supabase:templates:validate

      - name: Sync templates
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-supabase-email-templates.mjs --dry-run
          else
            node scripts/sync-supabase-email-templates.mjs
          fi
