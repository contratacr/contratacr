name: Mobile Native Regression

on:
  # Every push to mobile runs the cheap Linux jobs (contracts + WebView suites).
  # The Android emulator and the macOS iOS job stay on demand: the macOS runner
  # bills ten Linux minutes per minute.
  push:
    branches:
      - mobile
  workflow_dispatch:
    inputs:
      mobile_ref:
        description: The mobile branch or an exact deployed mobile commit SHA
        required: true
        default: mobile

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-native-regression-${{ github.event.inputs.mobile_ref || github.ref }}
  cancel-in-progress: true

# Use the CLI default: official ECR, GHCR and source-image fallback.
# An explicit registry override disables fallback when that registry throttles.

jobs:
  plan:
    name: Select required checks
    uses: ./.github/workflows/ci-test-plan.yml
    with:
      kind: mobile
      workflow: mobile-native-regression.yml
      ref: ${{ github.event.inputs.mobile_ref || github.sha }}
  contracts:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: Mobile contracts and local build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.mobile_ref || github.sha }}
      - name: Validate mobile ref
        shell: bash
        env:
          REQUESTED_MOBILE_REF: ${{ github.event.inputs.mobile_ref }}
        run: |
          set -euo pipefail
          requested_ref="${REQUESTED_MOBILE_REF:-mobile}"
          if [[ "$requested_ref" != "mobile" && ! "$requested_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Mobile regression accepts only the mobile branch or an exact 40-character commit SHA."
            exit 1
          fi
          echo "EXPECTED_MOBILE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:env
      - run: npm run mobile:validate
      - run: npx tsc --noEmit --pretty false

  mobile-webview:
    name: Native webview shell and direct chat
    permissions:
      contents: read
      packages: read
    needs: [plan, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_WEBKIT: "1"
      PLAYWRIGHT_LOCAL_PRODUCTION: "1"
      E2E_FIXTURES_READY: "1"
      CI: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.mobile_ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:env
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Authenticate official Supabase image pulls
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Start the minimal local Supabase stack
        run: >-
          supabase start
          --exclude imgproxy,postgres-meta,studio,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild every migration from an empty database
        run: supabase db reset --local --no-seed

      - name: Seed and verify the synthetic local regression foundation
        env:
          LOCAL_REGRESSION_PASSWORD: LocalRegression!2026
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/contratacr-local-supabase.env
          set -a
          source /tmp/contratacr-local-supabase.env
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export LOCAL_REGRESSION_SEED=1
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            printf '%s=%s\n' "SUPABASE_SERVICE_ROLE_KEY" "$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "LOCAL_REGRESSION_SEED=1"
            echo "E2E_FIXTURES_READY=1"
            echo "E2E_LEGACY_SEED=0"
            echo "E2E_ALLOW_NON_TEST_SUPABASE=1"
            echo "E2E_TEST_PASSWORD=$LOCAL_REGRESSION_PASSWORD"
            echo "REGRESSION_TEST_PASSWORD=$LOCAL_REGRESSION_PASSWORD"
            # La cuenta de solo cliente (seed-cuenta-cliente.js); la contraseña
            # es la misma que ya usan las pruebas que entran con ella.
            echo "CLIENTE_TEST_PASSWORD=ClientePruebas2026!"
            echo "PLAYWRIGHT_LOCAL_PRODUCTION=1"
            echo "PLAYWRIGHT_PORT=3000"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "CI_REQUEST_LOG=1"
          } >> "$GITHUB_ENV"
          psql "$DB_URL" \
            --set=local_seed_guard=contratacr-local-only \
            --file=scripts/ci/grant-local-regression-service-role.sql
          psql "$DB_URL" \
            --set=local_seed_guard=contratacr-local-only \
            --set=regression_password="$LOCAL_REGRESSION_PASSWORD" \
            --file=scripts/ci/seed-local-regression-auth.sql
          npm run seed:local:regression
          npm run verify:local:regression
          npm run seed:local:relations
          npm run verify:local:relations
          # En este mismo paso GITHUB_ENV todavía no rige: la contraseña va directa.
          CLIENTE_TEST_PASSWORD='ClientePruebas2026!' node scripts/seed-cuenta-cliente.js

      - name: Verify local Realtime before browser regression
        run: node scripts/ci/verify-local-realtime.mjs

      - name: Build the exact mobile commit locally
        run: npm run build
      - name: Install WebView browser engines
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit
      - name: Run planned WebView specs or the complete mobile suite
        env:
          SELECTED_SPECS: ${{ needs.plan.outputs.mobile_specs }}
          PLAN_SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          if [ "$PLAN_SCOPE" = "specs" ] || [ "$PLAN_SCOPE" = "sections" ]; then
            node scripts/ci/run-selected-specs.mjs --mobile
          else
            npm run test:e2e:mobile
          fi
      - name: Verify isolated fixtures after mobile regression
        if: always()
        run: npm run verify:local:relations
      - name: Upload mobile Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mobile-webview-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  android:
    name: Android lint, unit and emulator regression
    needs: contracts
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.mobile_ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # Por defecto instala «tools», que Google retiró de sdkmanager 16
          # (el del runner): «Failed to find package 'tools'» tumbaba el job.
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Compile, lint and run JVM tests
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Run native tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest
      - name: Upload Android reports and APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-native-regression
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  ios:
    name: iOS simulator build and launch regression
    needs: contracts
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.mobile_ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Compile unsigned iOS simulator app
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-simulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Install and launch on iOS simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")))')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
          LAUNCH_OUTPUT="$(xcrun simctl launch "$DEVICE_ID" com.contratacr.app)"
          echo "$LAUNCH_OUTPUT"
          grep -q "com.contratacr.app" <<< "$LAUNCH_OUTPUT"
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot build/ios-simulator/contratacr-launch.png
          test -s build/ios-simulator/contratacr-launch.png
      - name: Upload iOS simulator evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-simulator-regression
          path: |
            build/ios-simulator/contratacr-launch.png
            build/ios-simulator/Logs/
          if-no-files-found: ignore

  result:
    name: CI selection result
    if: always()
    needs: [plan, contracts, mobile-webview, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_SELECTED: ${{ needs.plan.outputs.run }}
          CHECK_0: ${{ needs.contracts.result }}
          CHECK_1: ${{ needs.mobile-webview.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$PLAN_RESULT" = "success"
          if [ "$RUN_SELECTED" = "true" ]; then
            test "$CHECK_0" = "success"
            test "$CHECK_1" = "success"
          else
            test "$RUN_SELECTED" = "false"
            test "$CHECK_0" = "skipped"
            test "$CHECK_1" = "skipped"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$ANDROID_RESULT" = "success"
            test "$IOS_RESULT" = "success"
          fi
          echo "Selected checks completed; unselected jobs were not executed." >> "$GITHUB_STEP_SUMMARY"
