name: Mobile Native Regression

on:
  workflow_dispatch:
    inputs:
      mobile_ref:
        description: The mobile branch or an exact deployed mobile commit SHA
        required: true
        default: mobile

permissions:
  contents: read

concurrency:
  group: mobile-native-regression-${{ github.event.inputs.mobile_ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Mobile contracts and public environment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MOBILE_BASE_URL: https://contratacr-mobile-test.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.mobile_ref }}
      - name: Validate mobile ref
        shell: bash
        env:
          REQUESTED_MOBILE_REF: ${{ github.event.inputs.mobile_ref }}
        run: |
          set -euo pipefail
          requested_ref="$REQUESTED_MOBILE_REF"
          if [[ "$requested_ref" != "mobile" && ! "$requested_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Mobile regression accepts only the mobile branch or an exact 40-character commit SHA."
            exit 1
          fi
          echo "EXPECTED_MOBILE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:env
      - run: npm run mobile:validate -- --remote
      - run: npx tsc --noEmit --pretty false
      - name: Wait for the exact canonical mobile deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            health="$(curl --silent --show-error --location --fail \
              -H "Cache-Control: no-cache" \
              "$MOBILE_BASE_URL/api/health?expected=$EXPECTED_MOBILE_SHA&attempt=$attempt" \
              2>/dev/null || true)"
            deployed_sha="$(jq -er '.commitSha // empty' <<<"$health" 2>/dev/null || true)"

            if [ "$deployed_sha" = "$EXPECTED_MOBILE_SHA" ]; then
              echo "Canonical mobile deployment is ready at $EXPECTED_MOBILE_SHA."
              exit 0
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "::error::$MOBILE_BASE_URL did not reach $EXPECTED_MOBILE_SHA within 10 minutes (reported ${deployed_sha:-no SHA})."
              exit 1
            fi
            echo "Waiting for the canonical mobile deployment ($attempt/60; reported ${deployed_sha:-no SHA})."
            sleep 10
          done

  android:
    name: Android lint, unit and emulator regression
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.mobile_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Compile, lint and run JVM tests
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Run native tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest
      - name: Upload Android reports and APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-native-regression
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  ios:
    name: iOS simulator build and launch regression
    needs: contracts
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.mobile_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Compile unsigned iOS simulator app
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-simulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Install and launch on iOS simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")))')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
          LAUNCH_OUTPUT="$(xcrun simctl launch "$DEVICE_ID" com.contratacr.app)"
          echo "$LAUNCH_OUTPUT"
          grep -q "com.contratacr.app" <<< "$LAUNCH_OUTPUT"
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot build/ios-simulator/contratacr-launch.png
          test -s build/ios-simulator/contratacr-launch.png
      - name: Upload iOS simulator evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-simulator-regression
          path: |
            build/ios-simulator/contratacr-launch.png
            build/ios-simulator/Logs/
          if-no-files-found: ignore
