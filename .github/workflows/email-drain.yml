name: Email outbox drain
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente de la cola de correo"
        required: true
        type: choice
        options: [production, test]
concurrency:
  group: email-drain-${{ github.event_name == 'schedule' && 'production' || inputs.target }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'schedule' && 'production' || inputs.target }}
    env:
      APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Drain durable email queue
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing email worker configuration."
            exit 1
          fi
          case "$APP_URL" in https://*) ;; *) exit 1 ;; esac
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' --max-time 280 \
            -X POST "${APP_URL%/}/api/internal/email/drain" \
            -H "Authorization: Bearer $CRON_SECRET" -H 'Content-Type: application/json')"
          echo "HTTP $status"
          cat "$body"
          if [ "$status" != "200" ] || ! grep -q '"ok":true' "$body"; then exit 1; fi
