name: Neon padron refresh

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment whose Neon padrón should be refreshed."
        required: true
        type: choice
        options:
          - test
          - production
      dry_run:
        description: "Validate download and connection without swapping live table."
        required: true
        type: boolean
        default: true

concurrency:
  group: neon-padron-refresh-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Neon padrón in ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    env:
      TARGET: ${{ inputs.target }}
      DRY_RUN: ${{ inputs.dry_run }}
      PADRON_DATABASE_URL: ${{ secrets.PADRON_DATABASE_URL }}
      PADRON_SAMPLE_CEDULA: "101053316"
      PADRON_SAMPLE_NOMBRE: "LUCILA"
      PADRON_SAMPLE_PAPELLIDO: "PORRAS"
      PADRON_SAMPLE_SAPELLIDO: "AGUERO"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate target and secrets
        run: |
          set -euo pipefail
          if [ -z "$PADRON_DATABASE_URL" ]; then
            echo "Missing PADRON_DATABASE_URL in the $TARGET GitHub Environment."
            exit 1
          fi
          if [ "$TARGET" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production Neon padron refresh must run from main."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Download and unzip padron
        run: |
          set -euo pipefail
          curl -L --retry 3 --retry-delay 5 -o padron.zip "https://www.tse.go.cr/zip/padron/padron_completo.zip"
          unzip -o padron.zip -d padron
          PADRON_FILE="$(find padron -maxdepth 2 -iname 'padron_completo.txt' -print -quit)"
          if [ -z "$PADRON_FILE" ]; then
            echo "Could not find padron_completo.txt inside the downloaded zip."
            find padron -maxdepth 2 -type f -print
            exit 1
          fi
          echo "PADRON_FILE=$PADRON_FILE" >> "$GITHUB_ENV"

      - name: Prepare padron COPY file
        run: |
          set -euo pipefail
          node scripts/prepare-padron-copy.mjs "$PADRON_FILE" padron-copy.tsv
          if [ "$TARGET" = "test" ]; then
            {
              grep "^${PADRON_SAMPLE_CEDULA}	" padron-copy.tsv || true
              head -n 100000 padron-copy.tsv
            } | awk '!seen[$1]++' > padron-copy-test.tsv
            mv padron-copy-test.tsv padron-copy.tsv
            echo "PADRON_MIN_ROWS=1000" >> "$GITHUB_ENV"
          else
            echo "PADRON_MIN_ROWS=3000000" >> "$GITHUB_ENV"
          fi
          echo "PADRON_COPY_FILE=$PWD/padron-copy.tsv" >> "$GITHUB_ENV"

      - name: Ensure Neon schema
        run: |
          set -euo pipefail
          psql "$PADRON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table if not exists public.padron (
            cedula text primary key,
            nombre text,
            papellido text,
            sapellido text
          );
          drop table if exists public.padron_staging;
          create table public.padron_staging (
            cedula text primary key,
            nombre text,
            papellido text,
            sapellido text
          );
          SQL

      - name: Load into Neon staging
        run: |
          set -euo pipefail
          psql "$PADRON_DATABASE_URL" -v ON_ERROR_STOP=1 -c "truncate table public.padron_staging;"
          psql "$PADRON_DATABASE_URL" -v ON_ERROR_STOP=1 -c "\\copy public.padron_staging (cedula, nombre, papellido, sapellido) from '$PADRON_COPY_FILE' with (format text, delimiter E'\\t')"
          psql "$PADRON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            staging_count bigint;
          BEGIN
            SELECT count(*) INTO staging_count FROM public.padron_staging;
            IF staging_count < current_setting('app.padron_min_rows')::bigint THEN
              RAISE EXCEPTION 'padron_staging has only % rows; refusing to swap', staging_count;
            END IF;
          END;
          $$;
          SQL
        env:
          PGOPTIONS: -c app.padron_min_rows=${{ env.PADRON_MIN_ROWS }}

      - name: Promote Neon staging
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          psql "$PADRON_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          drop table if exists public.padron_old;
          alter table if exists public.padron rename to padron_old;
          alter table public.padron_staging rename to padron;
          create table public.padron_staging (
            cedula text primary key,
            nombre text,
            papellido text,
            sapellido text
          );
          drop table if exists public.padron_old;
          commit;
          SQL

      - name: Verify Neon padron lookup
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          psql "$PADRON_DATABASE_URL" -v ON_ERROR_STOP=1 -c "select cedula, nombre, papellido, sapellido from public.padron where cedula = '$PADRON_SAMPLE_CEDULA';"
          row_count="$(psql "$PADRON_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "select count(*) from public.padron where cedula = '$PADRON_SAMPLE_CEDULA' and nombre = '$PADRON_SAMPLE_NOMBRE' and papellido = '$PADRON_SAMPLE_PAPELLIDO' and sapellido = '$PADRON_SAMPLE_SAPELLIDO';")"
          if [ "$row_count" != "1" ]; then
            echo "Neon padron sample lookup failed or parsed the name columns incorrectly."
            exit 1
          fi
