name: Supabase repair migration history

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment whose migration history should be repaired."
        required: true
        type: choice
        options:
          - test
          - production
      repair_through:
        description: "Last already-existing migration to mark as applied. Use 084 before applying 085."
        required: true
        type: string
        default: "084"

concurrency:
  group: supabase-repair-migrations-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair migration history in ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_ENV: ${{ inputs.target }}
      REPAIR_THROUGH: ${{ inputs.repair_through }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target == 'production' && 'main' || 'test' }}

      - name: Validate target
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing SUPABASE_DB_URL in the $TARGET_ENV GitHub Environment."
            exit 1
          fi
          if echo "$SUPABASE_DB_URL" | grep -q ":6543/"; then
            echo "::error::SUPABASE_DB_URL is using the transaction pooler port 6543. Use the shared pooler in session mode, usually port 5432."
            exit 1
          fi
          if ! echo "$REPAIR_THROUGH" | grep -Eq '^[0-9]{3}$'; then
            echo "::error::repair_through must be a 3-digit migration prefix, for example 084."
            exit 1
          fi

      - name: Mark existing migrations as applied
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for file in supabase/migrations/*.sql; do
            name="$(basename "$file")"
            version="${name%%_*}"
            if [ "$version" \> "$REPAIR_THROUGH" ]; then
              continue
            fi
            echo "Marking $name as applied in $TARGET_ENV migration history."
            npx supabase@2.109.0 migration repair --db-url "$SUPABASE_DB_URL" --status applied "$version"
            count=$((count + 1))
          done
          echo "Marked $count migration(s) as applied through $REPAIR_THROUGH."

      - name: Show pending migrations after repair
        run: |
          set -euo pipefail
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --dry-run
