name: Supabase migrations

on:
  push:
    branches:
      - test
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to update."
        required: true
        type: choice
        options:
          - test
          - production
      dry_run:
        description: "Preview migrations without applying them."
        required: true
        type: boolean
        default: true

concurrency:
  group: supabase-migrations-${{ github.event_name == 'push' && 'test' || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate ${{ github.event_name == 'push' && 'test' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'test' || inputs.target }}
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_ENV: ${{ github.event_name == 'push' && 'test' || inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate target
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing SUPABASE_DB_URL in the $TARGET_ENV GitHub Environment."
            exit 1
          fi
          if echo "$SUPABASE_DB_URL" | grep -q ":6543/"; then
            echo "::error::SUPABASE_DB_URL is using the transaction pooler port 6543. Supabase migrations need a direct connection or the shared pooler in session mode, usually port 5432, because transaction pooling can fail with prepared statement errors."
            exit 1
          fi
          if [ "$TARGET_ENV" = "test" ] && [ "${{ github.ref }}" != "refs/heads/test" ]; then
            echo "Test migrations must run from test."
            exit 1
          fi
          if [ "$TARGET_ENV" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production migrations must run from main."
            exit 1
          fi

      - name: Plan migrations
        run: |
          set -euo pipefail
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run | tee migration-plan.log
          if grep -q "001_initial_schema.sql" migration-plan.log; then
            echo "::error::001_initial_schema.sql is pending. This environment already exists, so refusing to apply old initial migrations."
            exit 1
          fi

      - name: Apply migrations
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          pending="$(npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run)"
          echo "$pending"
          if echo "$pending" | grep -q "001_initial_schema.sql"; then
            echo "::error::001_initial_schema.sql is still pending. Run 'Supabase repair migration history' through 084 for this environment before applying new migrations."
            exit 1
          fi
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --yes
