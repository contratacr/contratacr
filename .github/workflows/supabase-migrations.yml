name: Supabase migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to update."
        required: true
        type: choice
        options:
          - test
          - production
      dry_run:
        description: "Preview migrations without applying them."
        required: true
        type: boolean
        default: true
      bootstrap:
        description: "Solo para una base VACÍA (proyecto nuevo): permite aplicar el esquema desde la 001."
        required: false
        type: boolean
        default: false
      seed_directory:
        description: "Después de migrar, cargar el directorio (paquete cifrado en supabase/seed). Repetirlo es seguro."
        required: false
        type: boolean
        default: false
      directory_data:
        description: "SOLO TEST: secciones OSM que el paquete no trae (Educación, Trámites, Tiendas…), limpieza, filtros, menús y contactos (scripts/directory/run-test-data.mjs). Con dry_run solo cuenta. Repetirlo es seguro."
        required: false
        type: boolean
        default: false
      pro_demo:
        description: "SOLO TEST: crea o actualiza la cuenta ficticia demo-pro@contratacr.test (Pro activo) y la llena con datos de ejemplo de cada sección Pro (scripts/pro/demo/seed-pro-demo.mjs). Con dry_run solo cuenta. Repetirlo es seguro."
        required: false
        type: boolean
        default: false

concurrency:
  # Test migrations, mirroring/seeding and regression all mutate the same
  # isolated environment and must never overlap.
  group: ${{ inputs.target == 'test' && 'contratacr-test-environment' || 'supabase-migrations-production' }}
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.directory_data && 120 || inputs.seed_directory && 60 || inputs.pro_demo && 30 || 15 }}
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SEED_PACKAGE_KEY: ${{ secrets.SEED_PACKAGE_KEY }}
      TARGET_ENV: ${{ inputs.target }}
      TEST_SUPABASE_PROJECT_REF: oqheayqqprpciqdvdaqo
      PRODUCTION_SUPABASE_PROJECT_REF: kskueodxaksxvjrysouw
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Validate target
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing SUPABASE_DB_URL in the $TARGET_ENV GitHub Environment."
            exit 1
          fi
          if [ "${{ inputs.directory_data }}" = "true" ] && [ "$TARGET_ENV" != "test" ]; then
            echo "::error::directory_data only runs against test."
            exit 1
          fi
          if [ "${{ inputs.pro_demo }}" = "true" ] && [ "$TARGET_ENV" != "test" ]; then
            echo "::error::pro_demo only runs against test."
            exit 1
          fi
          if [ "$TARGET_ENV" = "test" ] && [ "${{ github.ref }}" != "refs/heads/test" ]; then
            echo "Test migrations must run from test."
            exit 1
          fi
          if [ "$TARGET_ENV" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production migrations must run from main."
            exit 1
          fi
          if [ "$TARGET_ENV" = "test" ]; then
            node scripts/ci/validate-supabase-target.mjs db SUPABASE_DB_URL "$TEST_SUPABASE_PROJECT_REF"
          else
            node scripts/ci/validate-supabase-target.mjs db SUPABASE_DB_URL "$PRODUCTION_SUPABASE_PROJECT_REF"
          fi

      - name: Verify empty database for bootstrap
        if: ${{ inputs.bootstrap == true }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" != "test" ]; then
            echo "::error::El arranque desde cero solo se permite en test."
            exit 1
          fi
          # Solo una base sin tablas puede recibir el esquema completo: así este
          # atajo nunca puede correr sobre un entorno con datos.
          # El listado del plan sale por el canal de errores: sin 2>&1 el conteo
          # daba cero y una base vacía se leía como "ya tiene esquema".
          tablas="$(npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run 2>&1 | grep -c '001_initial_schema.sql' || true)"
          if [ "$tablas" = "0" ]; then
            echo "::error::La base NO está vacía (la 001 ya está aplicada). Quita el arranque desde cero."
            exit 1
          fi
          echo "Base vacía confirmada: se aplicará el esquema completo."

      - name: Plan migrations
        if: ${{ inputs.bootstrap == false }}
        run: |
          set -euo pipefail
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run | tee migration-plan.log
          if grep -q "001_initial_schema.sql" migration-plan.log; then
            echo "::error::001_initial_schema.sql is pending. This environment already exists, so refusing to apply old initial migrations."
            exit 1
          fi
          historical="$(grep -Eo '[0-9]{3}_[A-Za-z0-9._-]+\.sql' migration-plan.log | awk -F_ '($1 + 0) < 165' | sort -u || true)"
          if [ -n "$historical" ]; then
            echo "::error::Historical migrations below 165 are missing; repair history explicitly before deployment."
            printf '%s\n' "$historical"
            exit 1
          fi

      - name: Apply migrations (bootstrap)
        if: ${{ inputs.dry_run == false && inputs.bootstrap == true }}
        run: |
          set -euo pipefail
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Apply migrations
        if: ${{ inputs.dry_run == false && inputs.bootstrap == false }}
        run: |
          set -euo pipefail
          pending="$(npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run)"
          echo "$pending"
          if echo "$pending" | grep -q "001_initial_schema.sql"; then
            echo "::error::001_initial_schema.sql is still pending. Run 'Supabase repair migration history' through 084 for this environment before applying new migrations."
            exit 1
          fi
          historical="$(printf '%s\n' "$pending" | grep -Eo '[0-9]{3}_[A-Za-z0-9._-]+\.sql' | awk -F_ '($1 + 0) < 165' | sort -u || true)"
          if [ -n "$historical" ]; then
            echo "::error::Historical migrations below 165 are missing; refusing an implicit repair."
            printf '%s\n' "$historical"
            exit 1
          fi
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      # Directory seed (OSM places, extras, health cleanup, brands, ARESEP fuel prices).
      # The SQL package is committed encrypted because the repository is public;
      # SEED_PACKAGE_KEY lives only in the GitHub Environments. Idempotent.
      - name: Decrypt directory seed
        if: ${{ inputs.seed_directory == true && inputs.dry_run == false }}
        run: |
          set -euo pipefail
          if [ -z "$SEED_PACKAGE_KEY" ]; then
            echo "::error::Missing SEED_PACKAGE_KEY in the $TARGET_ENV GitHub Environment."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh postgresql-client >/dev/null
          psql --version
          mkdir -p "$RUNNER_TEMP/seed/sql"
          node scripts/directory/seed/package-crypt.mjs decrypt supabase/seed/directorio-seed.enc "$RUNNER_TEMP/seed/pkg.tar.gz"
          tar -xzf "$RUNNER_TEMP/seed/pkg.tar.gz" -C "$RUNNER_TEMP/seed/sql"
          ls "$RUNNER_TEMP/seed/sql"

      - name: Seed directory
        if: ${{ inputs.seed_directory == true && inputs.dry_run == false }}
        env:
          SEED_SQL_DIR: ${{ runner.temp }}/seed/sql
          SEED_LOG_DIR: ${{ runner.temp }}/seed/logs
          SEED_SESSION_POOLER: "1"
        run: SEED_DB_URL="$SUPABASE_DB_URL" zsh scripts/directory/seed/run-seed.zsh "$TARGET_ENV"

      # Directory data on TEST only (2026-11-28): section filter attributes (cuisines, sodas, brands, chains, MEP,
      # cabinas) and «Ver menú» links, which the seed package predates. The OSM input is rebuilt from the public
      # Geofabrik Costa Rica extract (ODbL) with the converter the local import uses; places match by OSM reference.
      # run-test-data.mjs refuses any target but test and any database that is not the test project. Idempotent.
      - name: Directory data guard (test only)
        if: ${{ inputs.directory_data == true }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" != "test" ] || [ "${{ github.ref }}" != "refs/heads/test" ]; then
            echo "::error::directory_data only runs against test, from the test branch."; exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::The database URL names the production project."; exit 1 ;;
            *"$TEST_SUPABASE_PROJECT_REF"*) ;;
            *) echo "::error::The database URL is not the test project."; exit 1 ;;
          esac
          node scripts/ci/validate-supabase-target.mjs db SUPABASE_DB_URL "$TEST_SUPABASE_PROJECT_REF"

      - name: Set up Python (directory data)
        if: ${{ inputs.directory_data == true && inputs.target == 'test' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node (directory data)
        if: ${{ inputs.directory_data == true && inputs.target == 'test' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (directory data)
        if: ${{ inputs.directory_data == true && inputs.target == 'test' }}
        # osm-reclassify-cleanup.mjs needs @supabase/supabase-js; no install scripts run.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the OSM input (directory data)
        if: ${{ inputs.directory_data == true && inputs.target == 'test' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          python -m pip install --quiet "osmium==4.3.2"
          mkdir -p "$RUNNER_TEMP/osm/out"
          cd "$RUNNER_TEMP/osm"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o costa-rica-latest.osm.pbf https://download.geofabrik.de/central-america/costa-rica-latest.osm.pbf
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o costa-rica-latest.osm.pbf.md5 https://download.geofabrik.de/central-america/costa-rica-latest.osm.pbf.md5
          md5sum -c costa-rica-latest.osm.pbf.md5
          python -I "$GITHUB_WORKSPACE/scripts/directory/osm-pbf-to-json.py" costa-rica-latest.osm.pbf out
          ls -la out

      - name: Fill directory data (test)
        if: ${{ inputs.directory_data == true && inputs.target == 'test' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # Only for osm-reclassify-cleanup.mjs; run-test-data.mjs checks both name the test project first.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/osm/out"
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/directory/run-test-data.mjs test --pois "$out/osm-pois.json" --admin-areas "$out/osm-admin-areas.json"
          else
            node scripts/directory/run-test-data.mjs test --pois "$out/osm-pois.json" --admin-areas "$out/osm-admin-areas.json" --apply
          fi

      # Pro demo company on TEST only (2026-11-28): the fictitious account demo-pro@contratacr.test (reserved .test domain,
      # confirmed through the admin API, so no mail is sent) gets an active Pro grant and example data («Ejemplo») for each
      # Pro section, written with the same schemas and RPCs the /api/pro routes use. Its password comes only from the test
      # Environment secret PRO_DEMO_TEST_PASSWORD. seed-pro-demo.mjs refuses any target but test, any ref but the test
      # branch and any API URL or key that is not the test project. Idempotent; dry_run only reads and counts.
      - name: Pro demo guard (test only)
        if: ${{ inputs.pro_demo == true }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" != "test" ] || [ "${{ github.ref }}" != "refs/heads/test" ]; then
            echo "::error::pro_demo only runs against test, from the test branch."; exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*) echo "::error::The database URL names the production project."; exit 1 ;;
            *"$TEST_SUPABASE_PROJECT_REF"*) ;;
            *) echo "::error::The database URL is not the test project."; exit 1 ;;
          esac
          node scripts/ci/validate-supabase-target.mjs db SUPABASE_DB_URL "$TEST_SUPABASE_PROJECT_REF"
          node scripts/ci/validate-supabase-target.mjs api NEXT_PUBLIC_SUPABASE_URL "$TEST_SUPABASE_PROJECT_REF"

      - name: Set up Node (Pro demo)
        if: ${{ inputs.pro_demo == true && inputs.target == 'test' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (Pro demo)
        if: ${{ inputs.pro_demo == true && inputs.target == 'test' }}
        # supabase-js and esbuild (the app's zod schemas are bundled in memory); no install scripts run.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Seed the Pro demo company (test)
        if: ${{ inputs.pro_demo == true && inputs.target == 'test' }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRO_DEMO_TEST_PASSWORD: ${{ secrets.PRO_DEMO_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/pro/demo/seed-pro-demo.mjs test
          else
            test -n "$PRO_DEMO_TEST_PASSWORD" || { echo "::error::Missing test PRO_DEMO_TEST_PASSWORD."; exit 1; }
            node scripts/pro/demo/seed-pro-demo.mjs test --apply
          fi
