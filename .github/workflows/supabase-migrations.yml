name: Supabase migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to update."
        required: true
        type: choice
        options:
          - test
          - production
      dry_run:
        description: "Preview migrations without applying them."
        required: true
        type: boolean
        default: true
      bootstrap:
        description: "Solo para una base VACÍA (proyecto nuevo): permite aplicar el esquema desde la 001."
        required: false
        type: boolean
        default: false

concurrency:
  # Test migrations, mirroring/seeding and regression all mutate the same
  # isolated environment and must never overlap.
  group: ${{ inputs.target == 'test' && 'contratacr-test-environment' || 'supabase-migrations-production' }}
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_ENV: ${{ inputs.target }}
      TEST_SUPABASE_PROJECT_REF: oqheayqqprpciqdvdaqo
      PRODUCTION_SUPABASE_PROJECT_REF: kskueodxaksxvjrysouw
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Validate target
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing SUPABASE_DB_URL in the $TARGET_ENV GitHub Environment."
            exit 1
          fi
          if [ "$TARGET_ENV" = "test" ] && [ "${{ github.ref }}" != "refs/heads/test" ]; then
            echo "Test migrations must run from test."
            exit 1
          fi
          if [ "$TARGET_ENV" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production migrations must run from main."
            exit 1
          fi
          if [ "$TARGET_ENV" = "test" ]; then
            node scripts/ci/validate-supabase-target.mjs db SUPABASE_DB_URL "$TEST_SUPABASE_PROJECT_REF"
          else
            node scripts/ci/validate-supabase-target.mjs db SUPABASE_DB_URL "$PRODUCTION_SUPABASE_PROJECT_REF"
          fi

      - name: Verify empty database for bootstrap
        if: ${{ inputs.bootstrap == true }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" != "test" ]; then
            echo "::error::El arranque desde cero solo se permite en test."
            exit 1
          fi
          # Solo una base sin tablas puede recibir el esquema completo: así este
          # atajo nunca puede correr sobre un entorno con datos.
          tablas="$(npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run | grep -c '001_initial_schema.sql' || true)"
          if [ "$tablas" = "0" ]; then
            echo "::error::La base NO está vacía (la 001 ya está aplicada). Quita el arranque desde cero."
            exit 1
          fi
          echo "Base vacía confirmada: se aplicará el esquema completo."

      - name: Plan migrations
        if: ${{ inputs.bootstrap == false }}
        run: |
          set -euo pipefail
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run | tee migration-plan.log
          if grep -q "001_initial_schema.sql" migration-plan.log; then
            echo "::error::001_initial_schema.sql is pending. This environment already exists, so refusing to apply old initial migrations."
            exit 1
          fi
          historical="$(grep -Eo '[0-9]{3}_[A-Za-z0-9._-]+\.sql' migration-plan.log | awk -F_ '($1 + 0) < 165' | sort -u || true)"
          if [ -n "$historical" ]; then
            echo "::error::Historical migrations below 165 are missing; repair history explicitly before deployment."
            printf '%s\n' "$historical"
            exit 1
          fi

      - name: Apply migrations (bootstrap)
        if: ${{ inputs.dry_run == false && inputs.bootstrap == true }}
        run: |
          set -euo pipefail
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Apply migrations
        if: ${{ inputs.dry_run == false && inputs.bootstrap == false }}
        run: |
          set -euo pipefail
          pending="$(npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run)"
          echo "$pending"
          if echo "$pending" | grep -q "001_initial_schema.sql"; then
            echo "::error::001_initial_schema.sql is still pending. Run 'Supabase repair migration history' through 084 for this environment before applying new migrations."
            exit 1
          fi
          historical="$(printf '%s\n' "$pending" | grep -Eo '[0-9]{3}_[A-Za-z0-9._-]+\.sql' | awk -F_ '($1 + 0) < 165' | sort -u || true)"
          if [ -n "$historical" ]; then
            echo "::error::Historical migrations below 165 are missing; refusing an implicit repair."
            printf '%s\n' "$historical"
            exit 1
          fi
          npx supabase@2.109.0 db push --db-url "$SUPABASE_DB_URL" --include-all --yes
