name: Supabase baseline migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to baseline."
        required: true
        type: choice
        options:
          - test
          - production
      baseline_through:
        description: "Last migration version already present in the database, for example 083."
        required: true
        type: string
        default: "083"
      dry_run:
        description: "Preview repair command without changing migration history."
        required: true
        type: boolean
        default: true

concurrency:
  group: supabase-baseline-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  baseline:
    name: ${{ inputs.dry_run && 'Dry run' || 'Repair' }} migration history in ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BASELINE_THROUGH: ${{ inputs.baseline_through }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate target and baseline
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing SUPABASE_DB_URL in the ${{ inputs.target }} GitHub Environment."
            exit 1
          fi
          if [ "${{ inputs.target }}" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Production migration baseline must run from main."
            exit 1
          fi
          if ! [[ "$BASELINE_THROUGH" =~ ^[0-9]{3}$ ]]; then
            echo "baseline_through must be a 3-digit migration version, for example 083."
            exit 1
          fi

      - name: Build baseline version list
        run: |
          set -euo pipefail
          versions=()
          for file in supabase/migrations/*.sql; do
            name="$(basename "$file")"
            version="${name%%_*}"
            if [[ "$version" =~ ^[0-9]{3}$ ]] && [ $((10#$version)) -le $((10#$BASELINE_THROUGH)) ]; then
              versions+=("$version")
            fi
          done
          if [ "${#versions[@]}" -eq 0 ]; then
            echo "No migrations found through $BASELINE_THROUGH."
            exit 1
          fi
          printf '%s\n' "${versions[@]}" > baseline-versions.txt
          echo "Will mark ${#versions[@]} migration version(s) as applied:"
          paste -sd ' ' baseline-versions.txt

      - name: Repair migration history
        run: |
          set -euo pipefail
          mapfile -t versions < baseline-versions.txt
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run only. Would run:"
            echo "npx supabase@2.109.0 migration repair --db-url [hidden] --status applied ${versions[*]}"
            exit 0
          fi
          npx supabase@2.109.0 migration repair --db-url "$SUPABASE_DB_URL" --status applied "${versions[@]}" --yes
