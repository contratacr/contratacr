name: Meta conversion delivery
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-conversion-delivery
  cancel-in-progress: false
jobs:
  drain:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 2
    env:
      APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Deliver queued conversions
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then exit 0; fi
          case "$APP_URL" in https://contratacr.com|https://contratacr.com/|https://www.contratacr.com|https://www.contratacr.com/) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --max-time 60 -X POST "${APP_URL%/}/api/internal/meta/drain" -H "Authorization: Bearer $CRON_SECRET"
