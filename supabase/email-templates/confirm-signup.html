<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body, .email-bg, .ccr-email-background { background:#ffffff; }
  .ccr-email-card { border:0 !important; border-radius:0 !important; box-shadow:none !important; }
  .ccr-dark-logo, .dark-logo { display:none !important; mso-hide:all; max-height:0; overflow:hidden; }
  @media (max-width:600px) { .ccr-email-content { padding:32px 24px !important; } }
  @media (prefers-color-scheme: dark) {
    body, .email-bg, .ccr-email-background, .ccr-email-card { background:#111827 !important; color:#f3f4f6 !important; }
    .ccr-email-card h1, .ccr-email-card h2, .ccr-email-card p strong { color:#f3f4f6 !important; }
    .ccr-email-card p, .ccr-email-body { color:#cbd5e1 !important; }
    .ccr-email-card .ccr-email-muted { color:#9ca9bb !important; }
    .ccr-email-code { background:#173449 !important; color:#67d5f4 !important; }
    .ccr-email-code div { color:#67d5f4 !important; }
    .ccr-light-logo, .light-logo { display:none !important; }
    .ccr-dark-logo, .dark-logo { display:block !important; max-height:none !important; overflow:visible !important; }
  }
  [data-ogsc], [data-ogsc] .email-bg, [data-ogsc] .ccr-email-background, [data-ogsc] .ccr-email-card { background:#111827 !important; color:#f3f4f6 !important; }
  [data-ogsc] .ccr-email-card h1, [data-ogsc] .ccr-email-card h2, [data-ogsc] .ccr-email-card p strong { color:#f3f4f6 !important; }
  [data-ogsc] .ccr-email-card p, [data-ogsc] .ccr-email-body { color:#cbd5e1 !important; }
  [data-ogsc] .ccr-email-card .ccr-email-muted { color:#9ca9bb !important; }
  [data-ogsc] .ccr-email-code { background:#173449 !important; color:#67d5f4 !important; }
  [data-ogsc] .ccr-email-code div { color:#67d5f4 !important; }
  [data-ogsc] .ccr-light-logo, [data-ogsc] .light-logo { display:none !important; }
  [data-ogsc] .ccr-dark-logo, [data-ogsc] .dark-logo { display:block !important; max-height:none !important; overflow:visible !important; }
</style>
<title>Confirma tu correo</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;-webkit-text-size-adjust:100%;color:#162543;">
<table class="email-bg" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="background:#ffffff;">
  <tr>
    <td align="center" style="padding:16px 0;">
      <table class="ccr-email-card" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:600px;background:#ffffff;">
        <tr>
          <td align="left" style="padding:28px 28px 12px 28px;">
            <img class="light-logo" src="https://contratacr.com/brand/email-logo-light.png?v=2" width="167" height="39" alt="ContrataCR" style="display:block;border:0;outline:none;text-decoration:none;width:167px;height:auto;margin:0;">
            <img class="dark-logo" src="https://contratacr.com/brand/email-logo-dark.png?v=2" width="167" height="39" alt="ContrataCR" style="display:none;border:0;outline:none;text-decoration:none;width:167px;height:auto;margin:0;max-height:0;overflow:hidden;mso-hide:all;">
          </td>
        </tr>
        <tr>
          <td style="padding:8px 28px 0 28px;font-family:Arial,Helvetica,sans-serif;">
            <h1 style="font-size:21px;line-height:1.25;font-weight:700;margin:16px 0 10px 0;color:#162543;">Confirma tu correo</h1>
            <p style="font-size:15px;line-height:1.65;color:#374151;margin:0 0 22px 0;">Ingresa este código en la pantalla de registro para activar tu cuenta.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="ccr-email-code" align="center" bgcolor="#eef8fd" style="background:#eef8fd;border-radius:12px;">
                  <div style="font-family:Arial,Helvetica,sans-serif;font-size:36px;line-height:1.2;font-weight:700;letter-spacing:8px;color:#009FD9;padding:18px 28px;">{{ .Token }}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 28px 0 28px;font-family:Arial,Helvetica,sans-serif;">
            <p class="ccr-email-muted" style="font-size:13px;line-height:1.6;color:#6b7280;margin:0;">Si no creaste esta cuenta, puedes ignorar este correo.</p>
          </td>
        </tr>
        <tr>
          <td align="left" style="padding:24px 28px 30px 28px;font-family:Arial,Helvetica,sans-serif;">
            <p class="ccr-email-muted" style="font-size:12px;line-height:1.6;color:#8b97a6;margin:0;">ContrataCR · Servicios en Costa Rica</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
